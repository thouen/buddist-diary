<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学佛日记冒烟测试</title>
</head>
<body>
<pre id="out">RUNNING</pre>
<iframe id="app" style="width:420px;height:800px;border:0"></iframe>
<script>
(function () {
  var out = document.getElementById('out');
  var lines = [];
  var failed = 0;

  function check(name, ok, detail) {
    if (ok) lines.push('ok   ' + name);
    else {
      failed++;
      lines.push('FAIL ' + name + (detail ? ' — ' + detail : ''));
    }
  }

  function finish() {
    lines.push(failed ? ('SMOKE FAILED: ' + failed) : 'SMOKE OK');
    out.textContent = lines.join('\n');
    document.title = failed ? 'SMOKE FAILED' : 'SMOKE OK';
  }

  /* 尽量从干净的 localStorage 开始（file:// 需要 --allow-file-access-from-files） */
  try { localStorage.clear(); } catch (e) { }

  var frame = document.getElementById('app');
  frame.onload = function () {
    var win = frame.contentWindow;
    var doc = frame.contentDocument;
    var t = win.__xuefoTest;
    if (!t) {
      lines.push('FAIL 测试入口未暴露（?test=1）');
      finish();
      return;
    }

    /* 等 init() 里的首次引导计时器（320ms）跑完 */
    setTimeout(function () {
      try {
        var db = t.defaultDB();
        check('全新安装没有预置功课', db.tasks.length === 0, 'tasks=' + db.tasks.length);
        check('builtinRev 保持最新，首次安装不会被迁移回填', db.builtinRev === t.BUILTIN_REV);
        check('isYmdKey 拒绝 2026-02-31', t.isYmdKey('2026-02-31') === false);
        check('isYmdKey 接受 2024-02-29', t.isYmdKey('2024-02-29') === true);
        check('clampCount 收口到 1 亿', t.clampCount(1e300) === t.MAX_COUNT);
        check('clampStep 下限为 1', t.clampStep(0) === 1);

        var src = {
          v: 1,
          builtinRev: 2,
          orderRev: 1,
          bkeyRev: 1,
          settings: {},
          tasks: [{
            id: 't1', cat: 'nianfo', name: '念佛', unit: '遍',
            step: 100, fstep: 1, ftimer: false, bkey: 'nianfo:念佛',
            goal: 1e300, mgoal: -1, tgoal: 'x'
          }],
          records: {
            '2026-13-01': { c: { t1: 5 } },
            '2026-02-31': { c: { t1: 5 } },
            '2026-11-15': { c: { t1: 3 } }
          }
        };
        var outDb = t.sanitizeImport(src);
        check('导入结果非空', !!outDb);
        if (outDb) {
          check('保留 builtinRev（不被强行写成最新）', outDb.builtinRev === 2, 'got=' + outDb.builtinRev);
          check('保留 orderRev', outDb.orderRev === 1, 'got=' + outDb.orderRev);
          check('保留 bkeyRev', outDb.bkeyRev === 1, 'got=' + outDb.bkeyRev);
          check('缺失的 fstepRev 当 0，交给迁移决定', outDb.fstepRev === 0, 'got=' + outDb.fstepRev);
          check('保留任务 bkey', outDb.tasks[0].bkey === 'nianfo:念佛');
          check('导入丢弃已取消的 ftimer 开关', outDb.tasks[0].ftimer === undefined);
          check('导入目标收口到 1 亿', outDb.tasks[0].goal === t.MAX_COUNT, 'got=' + outDb.tasks[0].goal);
          check('无意义目标归零', outDb.tasks[0].mgoal === 0 && outDb.tasks[0].tgoal === 0);
          check('非法日期键被拒绝', Object.keys(outDb.records).length === 1 &&
            !!outDb.records['2026-11-15']);
          check('非法日期计数正确', t.lastImportReport().badDates === 2,
            'got=' + t.lastImportReport().badDates);
          check('导入计数按上限收口', outDb.records['2026-11-15'].c.t1 === 3);
        }

        /* 2.10：坏增量值封顶而不是清零；只写日记（没有功课）的备份也要能导回来 */
        check('clampCount 把 Infinity 封顶而不是清零',
          t.clampCount(Infinity) === t.MAX_COUNT, 'got=' + t.clampCount(Infinity));
        var diaryOnly = t.sanitizeImport({
          v: 1, settings: {}, tasks: [],
          records: { '2026-11-15': { dt: '只写了日记' } }
        });
        check('空功课、只有日记的备份可以导入',
          !!diaryOnly && diaryOnly.records['2026-11-15'].dt === '只写了日记');
        check('功课与记录都为空的备份仍被拒收',
          t.sanitizeImport({ v: 1, settings: {}, tasks: [], records: {} }) === null);

        check('空列表自动进入功课设置',
          !doc.querySelector('#view-tasks').classList.contains('hidden'));
        check('空列表自动打开推荐功课弹窗',
          doc.querySelector('#modal').classList.contains('on'));
        check('弹窗标题是「添加推荐功课」',
          doc.querySelector('#modal-box').textContent.indexOf('添加推荐功课') >= 0);
        check('只读横幅默认隐藏',
          doc.querySelector('#ro-banner').classList.contains('hidden'));

        /* 第一次打开时一项都不预选；把新增的诵经条目也核对一下 */
        var modalText = doc.querySelector('#modal-box').textContent;
        check('推荐清单包含新增诵经',
          ['四种决定清净明诲章', '文殊菩萨净行品', '大乘离文字普光明藏经', '随念三宝经'].every(function (n) {
            return modalText.indexOf(n) >= 0;
          }));
        var cks = doc.querySelectorAll('#modal .rb-ck');
        check('推荐功课默认一项都不勾选',
          cks.length > 0 && Array.prototype.every.call(cks, function (c) { return !c.checked; }));

        /* 全勾上再点「添加所选」：应写入列表并关掉弹窗 */
        Array.prototype.forEach.call(cks, function (c) { c.click(); });
        var okBtn = doc.querySelector('#modal [data-mok]');
        check('推荐弹窗有「添加所选」按钮', !!okBtn);
        if (okBtn) okBtn.click();

        setTimeout(function () {
          try {
            check('点「添加所选」后弹窗关闭',
              !doc.querySelector('#modal').classList.contains('on'));
            var rows = doc.querySelectorAll('#tasks-scroll .tk-row').length;
            check('推荐功课已写入列表', rows > 0, 'rows=' + rows);
            check('副标题行不再挂「专修计时」闹钟',
              doc.querySelectorAll('#tasks-scroll .ft-ico').length === 0 &&
              doc.querySelectorAll('#tasks-scroll .nm-sub').length === 0);

            /* 打开第一项的编辑弹窗：名称只读，且已经没有「专修计时」这个开关 */
            var firstEdit = doc.querySelector('#tasks-scroll [data-tedit]');
            if (firstEdit) firstEdit.click();
            check('编辑已有功课时名称只读',
              !!(doc.querySelector('#f-name') && doc.querySelector('#f-name').readOnly));
            check('编辑弹窗里没有「专修计时」开关', !doc.querySelector('#modal [data-mftimer]'));
            var fsave = doc.querySelector('#modal [data-tsave]');
            if (fsave) fsave.click();
            check('保存编辑后列表仍在', doc.querySelectorAll('#tasks-scroll .tk-row').length === rows);

            /* 再次打开：已有条目全部置灰，仍可转去「自定义」 */
            var reopen = doc.querySelector('#btn-recommend-tasks');
            check('功课设置页有「添加推荐功课」入口', !!reopen);
            if (reopen) reopen.click();
            check('推荐弹窗可再次打开',
              doc.querySelector('#modal').classList.contains('on'));
            var radd = doc.querySelector('#modal [data-radd]');
            check('推荐弹窗有「自定义」入口', !!radd);
            if (radd) radd.click();
            setTimeout(function () {
              try {
                check('自定义添加打开了功课编辑弹窗',
                  doc.querySelector('#modal').classList.contains('on') &&
                  !!doc.querySelector('#f-name'));
                /* 关掉编辑弹窗 → 回首页 → 切日记页，确认工具条在位置天气与正文之间 */
                var mclose = doc.querySelector('#modal [data-mclose]');
                if (mclose) mclose.click();
                var back = doc.querySelector('#view-tasks [data-back]');
                if (back) back.click();
                var dtab = doc.querySelector('#home-tabs [data-tab="diary"]');
                if (dtab) dtab.click();
                var kids = Array.prototype.map.call(doc.querySelectorAll('#diary-box > *'), function (el) {
                  return el.id || String(el.className || '').split(' ')[0];
                });
                check('日记工具条位于位置天气与正文之间',
                  kids[0] === 'diary-meta' && kids[1] === 'diary-bar' && kids[2] === 'blocks',
                  kids.join(','));

                /* 专修计时：进模式不自动走表 + 开始 / 暂停 / 继续 + 分段 */
                var ft = t.db().tasks[0];
                check('有可以试计时的功课', !!ft);
                if (ft) {
                  var ds = t.today();
                  t.openDetail(ft.id);
                  t.setFocusMode(true);
                  var segs0 = t.focusSegs(ds, ft.id, false);
                  check('进专修模式不自动开始计时',
                    !segs0 || segs0.length === 0, 'len=' + (segs0 ? segs0.length : 'null'));
                  check('计时卡始终在，且只有一个「今日累计」大数',
                    !!doc.querySelector('#focus-total') && !doc.querySelector('#focus-time'));
                  check('未开始时按钮写「开始计时」',
                    (doc.querySelector('#btn-focus-pause') || {}).textContent === '开始计时');
                  check('未开始时状态是 idle', t.focusState(t.detail()) === 'idle',
                    'got=' + t.focusState(t.detail()));
                  check('未开始时「停止计时」置灰不可点',
                    !!(doc.querySelector('#btn-focus-stop') || {}).disabled &&
                    (doc.querySelector('#btn-focus-stop') || {}).textContent === '停止计时');

                  /* 点「开始计时」才开第 1 段 */
                  var pb = doc.querySelector('#btn-focus-pause');
                  if (pb) pb.click();
                  var segs = t.focusSegs(ds, ft.id, false);
                  check('点「开始计时」才开第 1 段',
                    !!segs && segs.length === 1 && !segs[0].e,
                    'len=' + (segs ? segs.length : 'null'));
                  check('开始后按钮写「暂停计时」',
                    (doc.querySelector('#btn-focus-pause') || {}).textContent === '暂停计时');
                  check('走表时「停止计时」可点',
                    !(doc.querySelector('#btn-focus-stop') || {}).disabled);

                  doc.querySelector('#btn-focus-pause').click();
                  check('暂停后这一段当场收尾（e 已写）', segs[0].e > 0);
                  check('暂停后按钮写「继续计时」',
                    (doc.querySelector('#btn-focus-pause') || {}).textContent === '继续计时');

                  /* 「停止计时」：先确认，确认后收尾并回到「还没开始」，人仍留在专修模式里 */
                  doc.querySelector('#btn-focus-stop').click();
                  check('停止计时要弹确认', doc.querySelector('#modal').classList.contains('on'));
                  check('停止确认框写明今日已专修',
                    doc.querySelector('#modal-box').textContent.indexOf('今日已专修') >= 0);
                  var stopCancel = doc.querySelector('#modal [data-ack-cancel]');
                  if (stopCancel) stopCancel.click();
                  check('取消停止后仍是暂停态',
                    !doc.querySelector('#modal').classList.contains('on') &&
                    t.focusState(t.detail()) === 'paused');

                  doc.querySelector('#btn-focus-stop').click();
                  var stopOk = doc.querySelector('#modal [data-mok]');
                  if (stopOk) stopOk.click();
                  check('确认停止后回到 idle、卡片还在',
                    t.focusState(t.detail()) === 'idle' &&
                    !!doc.querySelector('#detail-focus .focus-card') &&
                    (doc.querySelector('#btn-focus-pause') || {}).textContent === '开始计时');

                  /* 没在计时时点「专」退出：不该弹确认框，直接就退 */
                  doc.querySelector('#btn-detail-mode').click();
                  check('没在计时时退出不弹确认', !doc.querySelector('#modal').classList.contains('on'));
                  check('退出后计时卡收起', !doc.querySelector('#detail-focus .focus-card'));

                  /* 重新进模式 → 开始 → 再点「专」退出：正在计时就要确认 */
                  t.setFocusMode(true);
                  doc.querySelector('#btn-focus-pause').click();
                  segs = t.focusSegs(ds, ft.id, false);
                  check('重进模式后又开了新的一段', segs.length === 2 && !segs[1].e,
                    'len=' + segs.length);
                  doc.querySelector('#btn-detail-mode').click();
                  check('正在计时时退出要确认', doc.querySelector('#modal').classList.contains('on'));
                  check('确认框写明今日已专修',
                    doc.querySelector('#modal-box').textContent.indexOf('今日已专修') >= 0);
                  var cancelBtn = doc.querySelector('#modal [data-ack-cancel]');
                  if (cancelBtn) cancelBtn.click();
                  check('取消后仍留在专修模式并接着走表',
                    !doc.querySelector('#modal').classList.contains('on') &&
                    t.focusState(t.detail()) === 'running' &&
                    (doc.querySelector('#btn-focus-pause') || {}).textContent === '暂停计时');

                  /* 不真等 65 秒：直接把第一段拉开，检查段列表与累计 */
                  segs[0].e = segs[0].s + 65000;
                  segs[1].s = Date.now() - 30000;
                  t.renderFocusPanel();
                  check('段列表按段列出两行',
                    doc.querySelectorAll('#detail-focus .fc-seg').length === 2,
                    'rows=' + doc.querySelectorAll('#detail-focus .fc-seg').length);
                  check('段数统计为 2', t.focusSegCount(ds, ft.id) === 2,
                    'got=' + t.focusSegCount(ds, ft.id));
                  check('今日累计＝两段之和（约 95 秒）',
                    t.focusDayMs(ds, ft.id) >= 94000,
                    'got=' + t.focusDayMs(ds, ft.id));
                  check('今日累计写在卡上（01:35 上下）',
                    /^01:3[3-9]$/.test((doc.querySelector('#focus-total') || {}).textContent || ''),
                    'got=' + (doc.querySelector('#focus-total') || {}).textContent);

                  t.setFocusMode(false);
                  check('退出专修模式后最后一段也收尾', segs[1].e > 0);
                  check('退出后计时卡再次收起', !doc.querySelector('#detail-focus .focus-card'));
                }
              } catch (e2) {
                failed++;
                lines.push('FAIL 运行异常：' + (e2 && e2.stack ? e2.stack : e2));
              }
              finish();
            }, 150);
          } catch (e1) {
            failed++;
            lines.push('FAIL 运行异常：' + (e1 && e1.stack ? e1.stack : e1));
            finish();
          }
        }, 150);
      } catch (e) {
        failed++;
        lines.push('FAIL 运行异常：' + (e && e.stack ? e.stack : e));
        finish();
      }
    }, 900);
  };
  frame.src = '../index.html?test=1';
})();
</script>
</body>
</html>
